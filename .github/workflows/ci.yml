name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q hub tests scripts
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hub/static/app.js
      - run: docker compose config --quiet
        env:
          HUB_ADMIN_PASSWORD: ci-not-a-real-password
          HUB_SESSION_SECRET: ci-not-a-real-secret-placeholder-value-long
